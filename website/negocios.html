<!doctype html>
<html lang="es">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

<body data-title-key="nav.business">
  <div id="site-header"></div>

      <span class="eyebrow" data-i18n="biz.eyebrow"></span>

      <div class="btn-row"><a class="btn btn-primary" href="contacto.html?type=business" data-i18n="biz.cta"></a></div>

      <div class="grid grid-3">
        <div class="card reveal"><span class="num">01</span><h3 data-i18n="biz.s1.title"></h3><p data-i18n="biz.s1.text"></p></div>
        <div class="card reveal"><span class="num">02</span><h3 data-i18n="biz.s2.title"></h3><p data-i18n="biz.s2.text"></p></div>

          <div class="step"><div><h3 data-i18n="biz.p1.title"></h3><p data-i18n="biz.p1.text"></p></div></div>

  <section class="section-dark cta-band">

      <h2 data-i18n="cta.title"></h2>
      <p class="lead center" data-i18n="cta.text"></p>
      <div class="btn-row"><a class="btn btn-primary" href="contacto.html" data-i18n="cta.button"></a></div>
    </div>
  </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/config.js"></script>
